[package]
name = "leet2"
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = false

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true


[dependencies]
itertools = "0.14.0"
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "ansi",
] }
tracing-appender = { version = "0.2.3", default-features = false }
rand = "0.9.2"
rayon = "1.11.0"
